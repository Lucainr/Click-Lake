services:
  server:
    build:
      context: ./server
    container_name: clicklake-server
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: clicklake-dashboard
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_DEV_PROXY_TARGET: http://server:8000
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
