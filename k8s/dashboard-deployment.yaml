apiVersion: apps/v1
kind: Deployment
metadata:
  name: clicklake-dashboard
  namespace: clicklake
  labels:
    app: clicklake-dashboard
    app.kubernetes.io/name: clicklake
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clicklake-dashboard
  template:
    metadata:
      labels:
        app: clicklake-dashboard
        app.kubernetes.io/name: clicklake
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: clicklake-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: clicklake-config
                  key: VITE_API_BASE_URL
            - name: VITE_DEV_PROXY_TARGET
              valueFrom:
                configMapKeyRef:
                  name: clicklake-config
                  key: VITE_DEV_PROXY_TARGET
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
